# ============================================================================
#  hissa-landing — konteyner ichidagi nginx (static landing xizmati).
#  Xavfsizlik sarlavhalari SERVER darajasida. DIQQAT: `location` ichiga
#  `add_header` QO'SHMANG — nginx'da bitta `add_header` o'sha location'dagi
#  server-darajali BARCHA `add_header`'larni o'chiradi (xavfsizlik yo'qoladi).
#  Kesh uchun `expires` ishlatamiz (u `add_header`'ni o'chirmaydi).
# ============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Healthcheck nuqtasi (index.html uzatmaydi — yengil).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Landing: noma'lum yo'llar → index.html (hozir router yo'q, lekin xavfsiz default).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashlangan assetlar (Vite nomga hash qo'yadi) — uzoq kesh.
    location /assets/ {
        expires 1y;
    }

    # index.html keshlanmaydi — yangi reliz darhol yetib borsin.
    location = /index.html {
        expires -1;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Xavfsizlik sarlavhalari (server darajasida — hamma javobga meros).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
